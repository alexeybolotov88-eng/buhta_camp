<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <title>Бухта Camp — Новогодняя смена 2–9 января · Тропикана Парк</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1350px; overflow: hidden; background: #14352f; }

    .canvas {
      position: relative;
      width: 1080px;
      height: 1350px;
      font-family: Manrope, sans-serif;
      color: #f3f7f5;
      overflow: hidden;
    }

    /* Misty bay photo, cool + wintry */
    .photo {
      position: absolute; inset: 0;
      background: url("../photos/buhta-mist-bay.png") 50% 34% / cover no-repeat;
      filter: saturate(0.82) brightness(0.96);
    }
    .shade {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(20,53,47,0.66) 0%, rgba(20,53,47,0.34) 24%, rgba(20,53,47,0.58) 56%, rgba(20,53,47,0.96) 100%),
        radial-gradient(120% 80% at 50% 0%, rgba(232,197,71,0.14), transparent 55%);
    }
    .frost {
      position: absolute; inset: 0;
      box-shadow: inset 0 0 220px rgba(230,240,236,0.20), inset 0 0 60px rgba(255,255,255,0.06);
      pointer-events: none;
    }

    .snow, .snow2 {
      position: absolute; inset: -20px;
      pointer-events: none;
    }
    .snow {
      background-image:
        radial-gradient(2.5px 2.5px at 40px 60px, rgba(255,255,255,0.95), transparent),
        radial-gradient(2px 2px at 180px 120px, rgba(255,255,255,0.75), transparent),
        radial-gradient(2.5px 2.5px at 320px 40px, rgba(255,255,255,0.90), transparent),
        radial-gradient(1.5px 1.5px at 90px 220px, rgba(255,255,255,0.65), transparent),
        radial-gradient(2px 2px at 260px 260px, rgba(255,255,255,0.80), transparent),
        radial-gradient(2.5px 2.5px at 380px 190px, rgba(255,255,255,0.85), transparent);
      background-size: 420px 420px;
    }
    .snow2 {
      background-image:
        radial-gradient(1.5px 1.5px at 60px 30px, rgba(255,255,255,0.55), transparent),
        radial-gradient(1.5px 1.5px at 200px 90px, rgba(255,255,255,0.45), transparent),
        radial-gradient(2px 2px at 140px 180px, rgba(255,255,255,0.55), transparent),
        radial-gradient(1.5px 1.5px at 300px 150px, rgba(255,255,255,0.40), transparent);
      background-size: 320px 300px;
    }

    .inner {
      position: relative;
      z-index: 3;
      width: 100%; height: 100%;
      padding: 80px 88px 84px;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.02em;
      color: #f3f7f5;
    }
    .brand b { color: #e8c547; font-weight: 800; }
    .flake-lg { width: 68px; height: 68px; color: #e8c547; opacity: 0.92; }
    .flake-lg svg { width: 100%; height: 100%; display: block; }

    .eyebrow {
      margin-top: 44px;
      font-weight: 700;
      font-size: 23px;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: #e8c547;
    }
    .headline {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 122px;
      line-height: 0.88;
      letter-spacing: -0.045em;
      color: #ffffff;
      margin-top: 18px;
      text-shadow: 0 2px 40px rgba(20,53,47,0.35);
    }
    .wave {
      width: 320px; height: 30px; color: #e8c547;
      margin: 26px 0 0;
    }
    .wave svg { width: 100%; height: 100%; display: block; }
    .hotel {
      margin-top: 24px;
      font-weight: 700;
      font-size: 32px;
      color: rgba(243,247,245,0.94);
    }
    .hotel b { color: #ffffff; font-weight: 800; }

    .spacer { flex: 1; }

    /* Program — the star of the poster */
    .prog-label {
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(243,247,245,0.72);
      margin-bottom: 22px;
    }
    .program { display: flex; flex-direction: column; gap: 16px; }
    .pitem {
      display: flex; align-items: center; gap: 22px;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.02em;
      color: #f3f7f5;
      line-height: 1;
    }
    .pitem.star { color: #e8c547; }
    .bullet { width: 40px; height: 40px; flex: none; color: #e8c547; }
    .bullet svg { width: 100%; height: 100%; display: block; }

    .dateblock {
      display: flex;
      align-items: flex-end;
      gap: 26px;
      margin-top: 42px;
      padding-top: 30px;
      border-top: 1px solid rgba(243,247,245,0.24);
    }
    .date-big {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 104px;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: #e8c547;
    }
    .date-meta { padding-bottom: 14px; }
    .date-meta .d1 {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1;
    }
    .date-meta .d2 {
      margin-top: 8px;
      font-weight: 700;
      font-size: 25px;
      color: rgba(243,247,245,0.82);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="photo"></div>
    <div class="shade"></div>
    <div class="snow"></div>
    <div class="snow2"></div>
    <div class="frost"></div>

    <div class="inner">
      <div class="top">
        <div class="brand">Бухта <b>Camp</b></div>
        <div class="flake-lg">
          <svg viewBox="0 0 100 100" fill="none">
            <g stroke="currentColor" stroke-width="4" stroke-linecap="round">
              <path d="M50 10 V90 M10 50 H90"/>
              <path d="M22 22 L78 78 M78 22 L22 78"/>
              <path d="M50 22 l-10 10 M50 22 l10 10 M50 78 l-10 -10 M50 78 l10 -10"/>
              <path d="M22 50 l10 -10 M22 50 l10 10 M78 50 l-10 -10 M78 50 l-10 10"/>
            </g>
          </svg>
        </div>
      </div>

      <div class="eyebrow">Новогодние каникулы · 2–9 января</div>
      <h1 class="headline">Новогодняя<br />смена</h1>
      <div class="wave">
        <svg viewBox="20 38 180 18" fill="none" aria-hidden="true">
          <path fill="currentColor" d="M28.00,47.91 C31.63,47.91 35.25,44.40 38.88,44.40 C42.50,44.40 46.13,42.24 49.76,42.24 C53.38,42.24 57.01,40.99 60.63,40.99 C64.26,40.99 67.88,40.88 71.51,40.88 C75.14,40.88 78.76,41.32 82.39,41.32 C86.01,41.32 89.64,42.91 93.27,42.91 C96.89,42.91 100.52,44.43 104.14,44.43 C108.05,44.43 111.95,46.87 115.86,46.87 C119.48,46.87 123.11,48.99 126.73,48.99 C130.36,48.99 133.99,49.84 137.61,49.84 C141.24,49.84 144.86,50.01 148.49,50.01 C152.12,50.01 155.74,49.51 159.37,49.51 C162.99,49.51 166.62,47.72 170.24,47.72 C173.87,47.72 177.50,45.01 181.12,45.01 C184.75,45.01 188.37,41.83 192.00,41.83 L192.00,41.83 C188.37,41.83 184.75,45.34 181.12,45.34 C177.50,45.34 173.87,48.71 170.24,48.71 C166.62,48.71 162.99,51.19 159.37,51.19 C155.74,51.19 152.12,52.51 148.49,52.51 C144.86,52.51 141.24,53.29 137.61,53.29 C133.99,53.29 130.36,53.53 126.73,53.53 C123.11,53.53 119.48,52.61 115.86,52.61 C111.95,52.61 108.05,50.17 104.14,50.17 C100.52,50.17 96.89,47.44 93.27,47.44 C89.64,47.44 86.01,44.77 82.39,44.77 C78.76,44.77 75.14,43.38 71.51,43.38 C67.88,43.38 64.26,42.66 60.63,42.66 C57.01,42.66 53.38,43.23 49.76,43.23 C46.13,43.23 42.50,44.73 38.88,44.73 C35.25,44.73 31.63,47.91 28.00,47.91 Z"/>
        </svg>
      </div>
      <p class="hotel">Отель <b>«Тропикана Парк»</b> · Подмосковье · 7–15 лет</p>

      <div class="spacer"></div>

      <div class="prog-label">В программе</div>
      <div class="program">
        <div class="pitem star">
          <span class="bullet"><svg viewBox="0 0 100 100" fill="none"><g stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M50 12 V88 M12 50 H88"/><path d="M26 26 L74 74 M74 26 L26 74"/></g></svg></span>
          Новогоднее шоу
        </div>
        <div class="pitem">
          <span class="bullet"><svg viewBox="0 0 100 100" fill="none"><g stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M50 12 V88 M12 50 H88"/><path d="M26 26 L74 74 M74 26 L26 74"/></g></svg></span>
          Творческие мастер-классы
        </div>
        <div class="pitem">
          <span class="bullet"><svg viewBox="0 0 100 100" fill="none"><g stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M50 12 V88 M12 50 H88"/><path d="M26 26 L74 74 M74 26 L26 74"/></g></svg></span>
          Плавание
        </div>
        <div class="pitem">
          <span class="bullet"><svg viewBox="0 0 100 100" fill="none"><g stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M50 12 V88 M12 50 H88"/><path d="M26 26 L74 74 M74 26 L26 74"/></g></svg></span>
          Вечеринки и дискотеки
        </div>
        <div class="pitem">
          <span class="bullet"><svg viewBox="0 0 100 100" fill="none"><g stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M50 12 V88 M12 50 H88"/><path d="M26 26 L74 74 M74 26 L26 74"/></g></svg></span>
          Воспоминания на весь год
        </div>
      </div>

      <div class="dateblock">
        <div class="date-big">2–9 января</div>
        <div class="date-meta">
          <div class="d1">8 дней</div>
          <div class="d2">каникулы у воды</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
