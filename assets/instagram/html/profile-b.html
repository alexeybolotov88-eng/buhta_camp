<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>Бухта Camp — шапка профиля Instagram B</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Syne:wght@800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 390px; height: 844px; overflow: hidden; }
    body { font-family: "Manrope", system-ui, sans-serif; color: #15241f; background: #fff; }
    .status { height: 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 22px 10px; font-size: 15px; font-weight: 700; }
    .nav { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 16px; }
    .nav-name { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 20px; letter-spacing: -0.03em; }
    .nav-name small { font-size: 10px; font-weight: 700; background: #e6f0ec; color: #1f6b5e; padding: 2px 6px; border-radius: 4px; }
    .nav-actions { display: flex; gap: 16px; }
    .icon { width: 24px; height: 24px; }
    .row { display: flex; align-items: center; padding: 8px 16px 14px; gap: 18px; }
    .avatar { width: 86px; height: 86px; border-radius: 50%; background: #14352f; flex: none; overflow: hidden; position: relative; box-shadow: 0 0 0 1px rgba(20,53,47,.12); }
    .avatar .ripple { position: absolute; inset: 0; background: url("../photos/buhta-water-ripple.png") center / cover; opacity: .25; }
    .avatar .lock { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; padding-top: 4px; }
    .avatar .lock b { font-family: Syne, sans-serif; font-size: 13px; letter-spacing: -.04em; }
    .avatar .lock i { display: block; width: 42px; height: 4px; margin: 3px 0 2px; background: #e8c547; border-radius: 99px; }
    .avatar .lock em { font-style: normal; font-size: 5px; letter-spacing: .42em; color: #e8c547; font-weight: 700; padding-left: .42em; }
    .stats { flex: 1; display: grid; grid-template-columns: repeat(3,1fr); text-align: center; }
    .stats b { display: block; font-size: 16px; font-weight: 800; }
    .stats span { font-size: 12px; color: #5c6e66; font-weight: 600; }
    .bio { padding: 0 16px 12px; }
    .bio .name { font-weight: 800; font-size: 14px; }
    .bio .cat { color: #5c6e66; font-size: 13px; font-weight: 600; margin: 1px 0 6px; }
    .bio p { font-size: 14px; line-height: 1.35; font-weight: 600; white-space: pre-line; }
    .bio a { display: inline-block; margin-top: 6px; color: #1f6b5e; font-weight: 800; font-size: 14px; text-decoration: none; }
    .btns { display: grid; grid-template-columns: 1fr 1fr 44px; gap: 8px; padding: 4px 16px 16px; }
    .btns button { height: 32px; border: 0; border-radius: 8px; background: #e6f0ec; color: #14352f; font: inherit; font-weight: 800; font-size: 13px; }
    .btns .primary { background: #d4572a; color: #fff; }
    .hl { display: flex; gap: 16px; padding: 4px 16px 18px; }
    .hl figure { width: 64px; text-align: center; margin: 0; }
    .hl .dot { width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid rgba(20,53,47,.12); padding: 3px; }
    .hl .dot i { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; }
    .hl figcaption { margin-top: 6px; font-size: 11px; font-weight: 700; }
    .rest { height: 260px; background: linear-gradient(#f3f7f5, #e6f0ec); }
  </style>
</head>
<body>
  <div class="status"><span>9:41</span><span>●●● ●</span></div>
  <div class="nav">
    <div class="nav-name">buhta.camp <small>лагерь</small></div>
    <div class="nav-actions">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#15241f" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#15241f" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
    </div>
  </div>
  <div class="row">
    <div class="avatar"><div class="ripple"></div><div class="lock"><b>БУХТА</b><i></i><em>CAMP</em></div></div>
    <div class="stats">
      <div><b>12</b><span>публикаций</span></div>
      <div><b>—</b><span>подписчики</span></div>
      <div><b>—</b><span>подписки</span></div>
    </div>
  </div>
  <div class="bio">
    <div class="name">Бухта Camp · 7–15 лет</div>
    <div class="cat">Детский лагерь</div>
    <p>Отпускаете спокойно.
Узнаёте — каждый вечер.

Небольшие группы у воды
Плавание · English · квесты
↓ Заявка на смену</p>
    <a href="#">buhta.camp</a>
  </div>
  <div class="btns">
    <button class="primary" type="button">Связаться</button>
    <button type="button">Смены</button>
    <button type="button">↗</button>
  </div>
  <div class="hl">
    <figure><div class="dot"><i style="background:#14352f"></i></div><figcaption>Смены</figcaption></figure>
    <figure><div class="dot"><i style="background:#14352f"></i></div><figcaption>Программа</figcaption></figure>
    <figure><div class="dot"><i style="background:#1f6b5e"></i></div><figcaption>Родителям</figcaption></figure>
    <figure><div class="dot"><i style="background:#14352f"></i></div><figcaption>Отзывы</figcaption></figure>
    <figure><div class="dot"><i style="background:#d4572a"></i></div><figcaption>Заявка</figcaption></figure>
  </div>
  <div class="rest"></div>
</body>
</html>
