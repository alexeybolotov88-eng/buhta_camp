<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>SM v3 geometric</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;box-sizing:border-box} html,body{width:1080px;height:1080px;overflow:hidden;font-family:Montserrat,sans-serif;background:#f4f8fc}
    .c{width:1080px;height:1080px;position:relative;overflow:hidden}
    .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(26,54,96,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(26,54,96,.06) 1px,transparent 1px);background-size:72px 72px}
    .blob1,.blob2,.blob3{position:absolute;border-radius:50%}
    .blob1{width:520px;height:520px;background:#5ba4e8;top:-120px;right:-100px;opacity:.22}
    .blob2{width:380px;height:380px;background:#e33d2d;bottom:-80px;left:-60px;opacity:.12}
    .blob3{width:240px;height:240px;background:#1a3660;top:360px;right:120px;opacity:.08}
    .panel{position:absolute;left:56px;top:56px;right:56px;bottom:56px;border:3px solid #1a3660;background:rgba(255,255,255,.78);backdrop-filter:blur(2px);padding:48px;display:flex;flex-direction:column;justify-content:space-between}
    .logo{width:200px}
    .ey{font-size:14px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:#5ba4e8;margin:20px 0 12px}
    h1{font-size:68px;line-height:.98;font-weight:900;color:#1a3660;letter-spacing:-.045em;max-width:760px}
    .line{width:120px;height:8px;background:#e33d2d;margin:22px 0}
    p{font-size:24px;font-weight:600;color:#35557f;line-height:1.35;max-width:680px}
    .foot{display:flex;justify-content:space-between;align-items:end;gap:20px}
    .cta{background:#1a3660;color:#fff;padding:18px 26px;border-radius:12px;font-size:18px;font-weight:800}
    .sq{width:96px;height:96px;border:3px solid #1a3660;display:grid;place-items:center;font-size:42px;font-weight:900;color:#e33d2d}
  </style>
</head>
<body>
  <div class="c"><div class="grid"></div><div class="blob1"></div><div class="blob2"></div><div class="blob3"></div>
    <div class="panel">
      <div><div class="logo"><svg viewBox="0 0 280 72" fill="none"><circle cx="36" cy="36" r="32" fill="#E33D2D"/><ellipse cx="36" cy="36" rx="22" ry="10" transform="rotate(-28 36 36)" fill="#5BA4E8"/><path fill="#fff" d="M22 38c6-8 14-10 20-6 2 1 3 3 3 5 0 4-4 7-9 7-3 0-6-2-8-4 1-1 2-1 3-2z"/><text x="84" y="34" font-family="Montserrat" font-weight="700" font-size="22" fill="#1A3660">Swimming</text><text x="84" y="56" font-family="Montserrat" font-weight="700" font-size="22" fill="#1A3660">Moscow</text></svg></div>
      <div class="ey">Новый сезон</div><h1>Набор в группы на сентябрь</h1><div class="line"></div><p>Для детей от 4 лет · небольшие группы · 5 бассейнов в Москве</p></div>
      <div class="foot"><div class="cta">Записаться на первое занятие</div><div class="sq">09</div></div>
    </div>
  </div>
</body>
</html>
