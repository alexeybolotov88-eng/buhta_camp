<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>SM v1 bold type</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;box-sizing:border-box} html,body{width:1080px;height:1080px;overflow:hidden;font-family:Montserrat,sans-serif}
    .c{width:1080px;height:1080px;background:#1a3660;color:#fff;position:relative;padding:56px}
    .logo{width:220px;margin-bottom:48px}
    .tag{display:inline-block;background:#e33d2d;padding:12px 22px;border-radius:999px;font-size:16px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;margin-bottom:28px}
    h1{font-size:92px;line-height:.92;font-weight:900;letter-spacing:-.05em;max-width:900px}
    h1 em{font-style:normal;color:#5ba4e8;display:block;font-size:78px;margin-top:8px}
    p{margin-top:32px;font-size:28px;font-weight:700;color:rgba(255,255,255,.82);max-width:760px;line-height:1.35}
    .cta{position:absolute;left:56px;bottom:56px;background:#fff;color:#1a3660;font-size:24px;font-weight:900;padding:22px 34px;border-radius:18px}
    .num{position:absolute;right:48px;bottom:40px;font-size:180px;font-weight:900;color:rgba(255,255,255,.06);line-height:1}
    .ring{position:absolute;top:120px;right:-80px;width:360px;height:360px;border:28px solid rgba(91,164,232,.25);border-radius:50%}
  </style>
</head>
<body>
  <div class="c">
    <div class="logo"><svg viewBox="0 0 280 72" fill="none"><circle cx="36" cy="36" r="32" fill="#E33D2D"/><ellipse cx="36" cy="36" rx="22" ry="10" transform="rotate(-28 36 36)" fill="#5BA4E8"/><path fill="#fff" d="M22 38c6-8 14-10 20-6 2 1 3 3 3 5 0 4-4 7-9 7-3 0-6-2-8-4 1-1 2-1 3-2z"/><text x="84" y="34" font-family="Montserrat" font-weight="700" font-size="22" fill="#fff">Swimming</text><text x="84" y="56" font-family="Montserrat" font-weight="700" font-size="22" fill="#fff">Moscow</text></svg></div>
    <div class="tag">Новый сезон</div>
    <h1>Набор<br/>в группы<em>на сентябрь</em></h1>
    <p>Дети от 4 лет · небольшие группы · 5 бассейнов в Москве</p>
    <div class="cta">Записаться на первое занятие →</div>
    <div class="num">09</div>
    <div class="ring"></div>
  </div>
</body>
</html>
