<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <title>Swimming Moscow — flat welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; font-family: Nunito, Montserrat, sans-serif; }
    .c { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
    .bg {
      position: absolute; inset: 0;
      background: url("../photos/sm-ref-style-flat-pool.png") center / cover no-repeat;
    }
    .veil {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(91,164,232,.22), transparent 45%);
    }
    .card {
      position: absolute; left: 48px; top: 56px; z-index: 2;
      max-width: 520px;
      background: rgba(255,255,255,.88);
      border-radius: 28px;
      padding: 36px 36px 40px;
      box-shadow: 0 18px 40px rgba(26,54,96,.12);
    }
    .ey {
      font-family: Montserrat, sans-serif;
      font-size: 18px; font-weight: 700; color: #5ba4e8;
      margin-bottom: 8px;
    }
    .logo-row { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .logo-row svg { width: 220px; display: block; }
    h1 {
      font-size: 54px; line-height: 1; font-weight: 900;
      letter-spacing: -0.04em; color: #1a3660;
    }
    .ask {
      margin-top: 14px; font-size: 34px; font-weight: 800; color: #5ba4e8;
    }
    .cta {
      display: inline-block; margin-top: 26px;
      background: #e33d2d; color: #fff;
      font-size: 20px; font-weight: 900;
      padding: 16px 26px; border-radius: 999px;
    }
    .burst {
      position: absolute; z-index: 1;
      width: 160px; height: 160px; border-radius: 50%;
      background: radial-gradient(circle, rgba(227,61,45,.35), transparent 70%);
    }
    .b1 { right: 40px; top: 40px; }
    .b2 { left: 80px; bottom: 80px; width: 120px; height: 120px; background: radial-gradient(circle, rgba(91,164,232,.4), transparent 70%); }
  </style>
</head>
<body>
  <div class="c">
    <div class="bg"></div>
    <div class="veil"></div>
    <div class="burst b1"></div>
    <div class="burst b2"></div>
    <div class="card">
      <div class="ey">Да, это</div>
      <div class="logo-row">
        <svg viewBox="0 0 280 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="36" cy="36" r="32" fill="#E33D2D"/>
          <ellipse cx="36" cy="36" rx="22" ry="10" transform="rotate(-28 36 36)" fill="#5BA4E8"/>
          <path fill="#fff" d="M22 38c6-8 14-10 20-6 2 1 3 3 3 5 0 4-4 7-9 7-3 0-6-2-8-4 1-1 2-1 3-2z"/>
          <text x="84" y="34" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="22" fill="#1A3660">Swimming</text>
          <text x="84" y="56" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="22" fill="#1A3660">Moscow</text>
        </svg>
      </div>
      <h1>Набор<br/>на сентябрь</h1>
      <div class="ask">Познакомимся?</div>
      <div class="cta">Записаться на первое занятие</div>
    </div>
  </div>
</body>
</html>
