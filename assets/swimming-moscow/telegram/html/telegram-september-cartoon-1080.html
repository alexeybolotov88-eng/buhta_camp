<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <title>Swimming Moscow — набор сентябрь, мульт</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: Nunito, Montserrat, system-ui, sans-serif;
    }
    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      background: linear-gradient(180deg, #fff8f0 0%, #eef6ff 42%, #5ba4e8 42%, #4a95dc 100%);
      overflow: hidden;
    }
    .top {
      position: absolute;
      inset: 0 0 52% 0;
      z-index: 3;
      padding: 44px 48px 0;
    }
    .logo {
      width: 210px;
      margin-bottom: 28px;
    }
    .logo svg { width: 100%; display: block; }
    .badge {
      display: inline-block;
      background: #e33d2d;
      color: #fff;
      font-family: Montserrat, sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 999px;
      transform: rotate(-2deg);
      box-shadow: 0 8px 0 #c53225;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 62px;
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #1a3660;
      max-width: 620px;
    }
    h1 span {
      display: inline-block;
      color: #fff;
      background: #1a3660;
      padding: 4px 14px 8px;
      border-radius: 16px;
      transform: rotate(-1.5deg);
      margin-top: 6px;
    }
    .sub {
      margin-top: 16px;
      font-size: 24px;
      font-weight: 800;
      color: #35557f;
      max-width: 520px;
      line-height: 1.25;
    }
    .cta {
      position: absolute;
      left: 48px;
      bottom: 54%;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 3px solid #1a3660;
      color: #1a3660;
      font-size: 20px;
      font-weight: 900;
      padding: 14px 22px;
      border-radius: 999px;
      box-shadow: 0 6px 0 rgba(26, 54, 96, 0.18);
    }
    .cta i {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #e33d2d;
      display: grid;
      place-items: center;
      color: #fff;
      font-style: normal;
      font-size: 16px;
    }
    .art {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58%;
      z-index: 1;
    }
    .art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }
    .art::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(238,246,255,1) 0%, rgba(238,246,255,0) 18%);
      z-index: 2;
      pointer-events: none;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.55);
      border: 2px solid rgba(255,255,255,.8);
      z-index: 2;
    }
    .b1 { width: 54px; height: 54px; top: 250px; right: 120px; }
    .b2 { width: 28px; height: 28px; top: 210px; right: 80px; }
    .b3 { width: 18px; height: 18px; top: 290px; right: 70px; }
    .star {
      position: absolute;
      z-index: 2;
      color: #e33d2d;
      font-size: 34px;
      font-weight: 900;
      transform: rotate(12deg);
      top: 180px;
      right: 48px;
    }
    .wave-deco {
      position: absolute;
      left: -20px;
      right: -20px;
      top: 39%;
      height: 48px;
      z-index: 3;
      color: #fff;
      opacity: .35;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 280 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="36" cy="36" r="32" fill="#E33D2D"/>
          <ellipse cx="36" cy="36" rx="22" ry="10" transform="rotate(-28 36 36)" fill="#5BA4E8"/>
          <path fill="#fff" d="M22 38c6-8 14-10 20-6 2 1 3 3 3 5 0 4-4 7-9 7-3 0-6-2-8-4 1-1 2-1 3-2z"/>
          <text x="84" y="34" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="22" fill="#1A3660">Swimming</text>
          <text x="84" y="56" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="22" fill="#1A3660">Moscow</text>
        </svg>
      </div>
      <div class="badge">Новый сезон</div>
      <h1>Набор в группы<br /><span>на сентябрь</span></h1>
      <p class="sub">Для детей от 4 лет · небольшие группы · 5 бассейнов в Москве</p>
    </div>
    <div class="star" aria-hidden="true">★</div>
    <div class="bubble b1" aria-hidden="true"></div>
    <div class="bubble b2" aria-hidden="true"></div>
    <div class="bubble b3" aria-hidden="true"></div>
    <svg class="wave-deco" viewBox="0 0 1120 48" fill="none" aria-hidden="true">
      <path fill="currentColor" d="M0 24c70-16 140-16 210 0s140 16 210 0 140-16 210 0 140 16 210 0 140-16 210 0 140 16 210 0v24H0V24z"/>
    </svg>
    <div class="cta"><i>→</i> Записаться на первое занятие</div>
    <div class="art">
      <img src="../photos/swimming-moscow-cartoon-kids.png" alt="" />
    </div>
  </div>
</body>
</html>
