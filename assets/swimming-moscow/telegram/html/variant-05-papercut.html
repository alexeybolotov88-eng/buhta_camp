<!DOCTYPE html>
<html lang="ru">
<head>

  <title>SM v5 papercut</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Literata:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;box-sizing:border-box} html,body{width:1080px;height:1080px;overflow:hidden}
    .c{width:1080px;height:1080px;position:relative;background:#faf6ef;color:#1a3660;font-family:Literata,serif}
    .bg{position:absolute;inset:0;background:url('../photos/sm-variant-papercut.png') center/cover}

    .ey{font-family:Montserrat,sans-serif;font-size:13px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:#5ba4e8;margin:22px 0 10px}
    h1{font-size:58px;line-height:1.02;font-weight:700;max-width:700px}
    h1 em{font-style:normal;color:#e33d2d}
    p{font-family:Montserrat,sans-serif;font-size:22px;font-weight:600;line-height:1.4;max-width:620px;color:#35557f;margin-top:16px}
    .cta{display:inline-block;font-family:Montserrat,sans-serif;background:#e33d2d;color:#fff;padding:16px 24px;border-radius:999px;font-size:18px;font-weight:800}

</head>

  <div class="c"><div class="bg"></div><div class="veil"></div>
    <div class="in"><div><div class="logo"><svg viewBox="0 0 280 72" fill="none"><circle cx="36" cy="36" r="32" fill="#E33D2D"/><ellipse cx="36" cy="36" rx="22" ry="10" transform="rotate(-28 36 36)" fill="#5BA4E8"/><path fill="#fff" d="M22 38c6-8 14-10 20-6 2 1 3 3 3 5 0 4-4 7-9 7-3 0-6-2-8-4 1-1 2-1 3-2z"/><text x="84" y="34" font-family="Montserrat" font-weight="700" font-size="22" fill="#1A3660">Swimming</text><text x="84" y="56" font-family="Montserrat" font-weight="700" font-size="22" fill="#1A3660">Moscow</text></svg></div>
    <div class="ey">Новый сезон</div><h1>Набор в группы <em>на сентябрь</em></h1><p>Мягкое обучение для детей от 4 лет. Небольшие группы, 5 бассейнов в Москве.</p></div>
