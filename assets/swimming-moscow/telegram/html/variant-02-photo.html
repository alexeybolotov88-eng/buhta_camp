<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>SM v2 photo editorial</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;box-sizing:border-box} html,body{width:1080px;height:1080px;overflow:hidden;font-family:Montserrat,sans-serif}
    .c{width:1080px;height:1080px;position:relative;color:#fff}
    .bg{position:absolute;inset:0;background:url('../photos/sm-variant-photo-pool.png') center/cover}
    .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,54,96,.92) 0%,rgba(26,54,96,.55) 38%,rgba(26,54,96,.25) 68%,rgba(26,54,96,.75) 100%)}
    .in{position:relative;z-index:2;height:100%;padding:52px;display:flex;flex-direction:column;justify-content:space-between}
    .logo{width:210px}.tag{font-size:14px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:#5ba4e8;margin:24px 0 14px}
    h1{font-size:74px;line-height:1;font-weight:800;letter-spacing:-.04em;max-width:820px}
    h1 span{color:#e33d2d}
    .sub{font-size:26px;font-weight:600;line-height:1.35;max-width:680px;margin-top:18px;color:rgba(255,255,255,.9)}
    .row{display:flex;gap:16px;flex-wrap:wrap}
    .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:14px 20px;border-radius:999px;font-size:16px;font-weight:700}
    .cta{background:#e33d2d;padding:18px 28px;border-radius:999px;font-size:20px;font-weight:800}
  </style>
</head>
<body>
  <div class="c"><div class="bg"></div><div class="shade"></div>
    <div class="in">
      <div><div class="logo"><svg viewBox="0 0 280 72" fill="none"><circle cx="36" cy="36" r="32" fill="#E33D2D"/><ellipse cx="36" cy="36" rx="22" ry="10" transform="rotate(-28 36 36)" fill="#5BA4E8"/><path fill="#fff" d="M22 38c6-8 14-10 20-6 2 1 3 3 3 5 0 4-4 7-9 7-3 0-6-2-8-4 1-1 2-1 3-2z"/><text x="84" y="34" font-family="Montserrat" font-weight="700" font-size="22" fill="#fff">Swimming</text><text x="84" y="56" font-family="Montserrat" font-weight="700" font-size="22" fill="#fff">Moscow</text></svg></div>
      <div class="tag">Новый сезон · сентябрь</div>
      <h1>Набор в группы <span>на сентябрь</span></h1>
      <p class="sub">Школа плавания для детей от 4 лет. Уверенно в воде — без страха и с удовольствием.</p></div>
      <div class="row"><span class="pill">5 бассейнов в Москве</span><span class="pill">Небольшие группы</span><span class="cta">Записаться на первое занятие</span></div>
    </div>
  </div>
</body>
</html>
