<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>SM v4 retro sport</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;box-sizing:border-box} html,body{width:1080px;height:1080px;overflow:hidden;font-family:Montserrat,sans-serif}
    .c{width:1080px;height:1080px;position:relative;background:#f3ead8;color:#1a3660;overflow:hidden}
    .art{position:absolute;inset:0;background:url('../photos/sm-variant-retro.png') center bottom/cover}
    .top{position:absolute;inset:0;background:linear-gradient(180deg,rgba(243,234,216,.96) 0%,rgba(243,234,216,.82) 42%,rgba(243,234,216,0) 62%)}
    .stripe{position:absolute;top:0;left:0;right:0;height:18px;background:repeating-linear-gradient(90deg,#1a3660 0 40px,#e33d2d 40px 80px,#5ba4e8 80px 120px)}
    .in{position:relative;z-index:2;padding:48px;height:100%;display:flex;flex-direction:column}
    .logo{width:200px;margin-top:18px}
    .ey{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.12em;color:#e33d2d;margin:26px 0 8px}
    h1{font-family:'Bebas Neue',sans-serif;font-size:108px;line-height:.88;letter-spacing:.02em;max-width:760px}
    p{margin-top:18px;font-size:24px;font-weight:700;max-width:620px;line-height:1.3}
    .cta{margin-top:auto;align-self:flex-start;background:#1a3660;color:#fff;padding:18px 28px;font-size:20px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
    .box{position:absolute;right:48px;top:220px;width:180px;height:180px;border:4px solid #1a3660;display:grid;place-items:center;font-family:'Bebas Neue',sans-serif;font-size:72px;color:#e33d2d;background:rgba(255,255,255,.55)}
  </style>
</head>
<body>
  <div class="c"><div class="stripe"></div><div class="art"></div><div class="top"></div><div class="box">SEP</div>
    <div class="in"><div class="logo"><svg viewBox="0 0 280 72" fill="none"><circle cx="36" cy="36" r="32" fill="#E33D2D"/><ellipse cx="36" cy="36" rx="22" ry="10" transform="rotate(-28 36 36)" fill="#5BA4E8"/><path fill="#fff" d="M22 38c6-8 14-10 20-6 2 1 3 3 3 5 0 4-4 7-9 7-3 0-6-2-8-4 1-1 2-1 3-2z"/><text x="84" y="34" font-family="Montserrat" font-weight="700" font-size="22" fill="#1A3660">Swimming</text><text x="84" y="56" font-family="Montserrat" font-weight="700" font-size="22" fill="#1A3660">Moscow</text></svg></div>
    <div class="ey">New season · 2026</div><h1>Набор в группы на сентябрь</h1><p>Дети от 4 лет · 5 бассейнов · небольшие группы</p><div class="cta">Записаться на первое занятие</div></div>
  </div>
</body>
</html>
