<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <title>Swimming Moscow — стиль 3D как Fun Swim</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Nunito:wght@800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; font-family: Nunito, Montserrat, sans-serif; }
    .c {
      width: 1080px; height: 1080px; position: relative;
      background: linear-gradient(160deg, #e8f4ff 0%, #d6ebff 45%, #b8dcff 100%);
      overflow: hidden;
    }
    .bg {
      position: absolute; inset: 0;
      background: url("../photos/sm-ref-style-3d-boy.png") 68% 55% / cover no-repeat;
    }
    .shade {
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(232,244,255,.97) 0%, rgba(232,244,255,.88) 38%, rgba(232,244,255,.15) 62%, transparent 78%),
        linear-gradient(180deg, rgba(232,244,255,.55) 0%, transparent 28%, transparent 72%, rgba(26,54,96,.35) 100%);
    }
    .logo {
      position: absolute; left: 48px; top: 44px; z-index: 3; width: 240px;
    }
    .logo svg { width: 100%; display: block; filter: drop-shadow(0 2px 8px rgba(26,54,96,.12)); }
    .badge {
      position: absolute; right: 42px; top: 42px; z-index: 3;
      width: 210px; height: 210px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #2a4f8a, #1a3660 70%);
      color: #fff; display: grid; place-items: center; text-align: center;
      box-shadow: 0 14px 28px rgba(26,54,96,.28);
      border: 6px solid #fff;
      transform: rotate(8deg);
    }
    .badge strong {
      font-size: 22px; line-height: 1.15; font-weight: 900;
      letter-spacing: -0.02em; padding: 0 18px;
    }
    .badge span { display: block; font-size: 15px; opacity: .9; margin-top: 4px; font-weight: 800; }
    .content {
      position: absolute; left: 48px; top: 280px; z-index: 3; max-width: 520px;
    }
    h1 {
      font-size: 52px; line-height: 1.02; font-weight: 900;
      letter-spacing: -0.035em; color: #1a3660;
    }
    h1 em { font-style: normal; color: #e33d2d; display: block; margin-top: 4px; }
    .chip {
      display: inline-block; margin-top: 22px;
      background: #1a3660; color: #fff;
      font-size: 24px; font-weight: 900;
      padding: 14px 24px; border-radius: 18px;
      box-shadow: 0 8px 0 #122845;
      transform: rotate(-1.5deg);
    }
    .foot {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
      height: 168px; background: rgba(255,255,255,.92);
      backdrop-filter: blur(6px);
      display: grid; grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid rgba(26,54,96,.08);
    }
    .item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; text-align: center; padding: 16px;
      border-right: 1px solid rgba(26,54,96,.08);
    }
    .item:last-child { border-right: 0; }
    .ico {
      width: 54px; height: 54px; border-radius: 50%;
      background: #e8f4ff; color: #1a3660;
      display: grid; place-items: center;
    }
    .item b {
      font-size: 15px; font-weight: 900; letter-spacing: 0.04em;
      text-transform: uppercase; color: #1a3660; line-height: 1.25;
    }
    .leaf {
      position: absolute; z-index: 2; font-size: 42px; opacity: .85;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.08));
    }
    .l1 { left: 420px; top: 120px; transform: rotate(-18deg); }
    .l2 { left: 500px; top: 200px; transform: rotate(24deg); font-size: 28px; }
    .l3 { right: 260px; bottom: 210px; transform: rotate(12deg); font-size: 34px; }
  </style>
</head>
<body>
  <div class="c">
    <div class="bg"></div>
    <div class="shade"></div>
    <div class="leaf l1" aria-hidden="true">🍁</div>
    <div class="leaf l2" aria-hidden="true">🍂</div>
    <div class="leaf l3" aria-hidden="true">🍁</div>
    <div class="logo">
      <svg viewBox="0 0 280 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="36" cy="36" r="32" fill="#E33D2D"/>
        <ellipse cx="36" cy="36" rx="22" ry="10" transform="rotate(-28 36 36)" fill="#5BA4E8"/>
        <path fill="#fff" d="M22 38c6-8 14-10 20-6 2 1 3 3 3 5 0 4-4 7-9 7-3 0-6-2-8-4 1-1 2-1 3-2z"/>
        <text x="84" y="34" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="22" fill="#1A3660">Swimming</text>
        <text x="84" y="56" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="22" fill="#1A3660">Moscow</text>
      </svg>
    </div>
    <div class="badge"><strong>ПЕРВОЕ ЗАНЯТИЕ<br/>СО СКИДКОЙ<br/><span>10%</span></strong></div>
    <div class="content">
      <h1>СЕНТЯБРЬ —<em>ВРЕМЯ НОВЫХ<br/>ДОСТИЖЕНИЙ!</em></h1>
      <div class="chip">Набор в группы с сентября!</div>
    </div>
    <div class="foot">
      <div class="item">
        <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16c3-2 5-6 8-6s5 4 8 6"/><circle cx="12" cy="7" r="2"/></svg></div>
        <b>Для детей<br/>от 4 лет</b>
      </div>
      <div class="item">
        <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="10" r="2.5"/><circle cx="16" cy="10" r="2.5"/><circle cx="12" cy="15" r="2.5"/></svg></div>
        <b>Малые<br/>группы</b>
      </div>
      <div class="item">
        <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 16l-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg></div>
        <b>Опытные<br/>тренеры</b>
      </div>
    </div>
  </div>
</body>
</html>
